version: '3.9'

# ──────────────────────────────────────────────────────────────────────────────
# WorkPlan / FlowLive — Docker Compose (MongoDB Atlas)
#
# Quick start:
#   cp .env.example .env          # fill in MONGODB_URI, JWT_SECRET, emails
#   docker-compose up --build
#
# Access:
#   Frontend  → http://localhost
#   Backend   → http://localhost:5001
#
# Remote server: set VITE_API_URL=http://<server-ip>:5001 in .env BEFORE build.
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── Backend (Node.js / Express / Socket.io / MongoDB Atlas) ─────────────────
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: workflowlive-backend
    container_name: workflowlive-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5001}:5001"
    environment:
      PORT: 5001
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI is required — set it in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — set it in .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-465}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Frontend (Vite build → Nginx) ───────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5001}
    image: workflowlive-frontend
    container_name: workflowlive-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
