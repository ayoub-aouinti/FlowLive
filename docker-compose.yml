version: '3.9'

# ──────────────────────────────────────────────────────────────────────────────
# WorkPlan / FlowLive — Docker Compose (Single Container + Local MongoDB)
#
# Quick start:
#   cp .env.example .env          # fill in JWT_SECRET, email configurations, etc.
#   docker-compose up --build
#
# Access:
#   App (Frontend & Backend)  → http://localhost:5001
# ──────────────────────────────────────────────────────────────────────────────

services:

  # ── Local MongoDB Database ──────────────────────────────────────────────────
  mongodb:
    image: mongo:6.0
    container_name: workflowlive-db
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db

  # ── Unified Application (Frontend + Backend on port 5001) ───────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5001}
    image: workflowlive-app
    container_name: workflowlive-app
    restart: unless-stopped
    # Exposed internally (no host binding to avoid port conflicts).
    # If you need direct IP:port access, uncomment the ports section below:
    # ports:
    #   - "${PORT_HOST:-5001}:5001"
    environment:
      PORT: 5001
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/flowlive}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — set it in .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5001}
      EMAIL_HOST: ${EMAIL_HOST:-smtp.gmail.com}
      EMAIL_PORT: ${EMAIL_PORT:-465}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    depends_on:
      - mongodb
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  mongodb_data:
