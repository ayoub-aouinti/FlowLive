services:
  - type: web
    name: flowlive
    runtime: node
    region: frankfurt
    plan: free
    rootDir: .
    buildCommand: npm ci && npm run build && mkdir -p server/public && cp -r dist/. server/public/ && npm ci --prefix server
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false        # set manually in Render dashboard
      - key: JWT_SECRET
        sync: false        # set manually in Render dashboard
      - key: FRONTEND_URL
        sync: false        # set to your Render URL e.g. https://flowlive-5a7s.onrender.com
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
