services:
  - type: web
    name: flowlive-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: server
    buildCommand: npm ci
    startCommand: node index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: USE_LOCAL_DB
        value: false
      - key: MONGODB_URI
        sync: false        # set in Render dashboard
      - key: JWT_SECRET
        sync: false        # set in Render dashboard
      - key: FRONTEND_URL
        sync: false        # set to your Vercel URL e.g. https://flowlive.vercel.app
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
